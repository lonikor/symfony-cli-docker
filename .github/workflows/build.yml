name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly rebuild so base-image CVE patches (Alpine/PHP) land in `latest` even
  # when nothing in the repo changes. The scan gate runs against the fresh image.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # Manual trigger to force a rebuild/refresh of `latest` on demand.
  workflow_dispatch:

# Least privilege by default for every job; jobs opt into more where needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref, but let tag (release) builds always
# finish so a published version is never half-built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Docker Hub image name. The repo (e.g. "symfony-cli") lives under your
# Docker Hub account; the account comes from the DOCKERHUB_USERNAME secret.
env:
  IMAGE_NAME: symfony-cli

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the image version and decide whether the *immutable version tag*
  # should be (re)published.
  #
  # We always build, smoke-test, scan, and (outside PRs) publish the moving tags
  # (`latest`, `sha-<commit>`, `main`). This keeps `latest` validated and fresh —
  # picking up Dockerfile edits and weekly base-image CVE patches — regardless of
  # whether the Symfony CLI version changed.
  #
  # The only thing that is version-gated is the immutable `<version>` tag (e.g.
  # `1.2.3`), which mirrors the Symfony CLI binary baked into the image. We refuse
  # to overwrite it once it exists on Docker Hub, so a published version digest
  # stays stable. It is (re)written only when:
  #   * a git tag (release) is pushed, or
  #   * a branch push introduces a version that does not yet exist on Docker Hub.
  # On scheduled/manual refreshes we deliberately do NOT rewrite it — only the
  # moving tags get the patched rebuild.
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      version_is_new: ${{ steps.decide.outputs.version_is_new }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve version and version-tag policy
        id: decide
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          # Single source of truth: the SYMFONY_CLI_VERSION default in the Dockerfile.
          version="$(sed -n 's/^ARG SYMFONY_CLI_VERSION=//p' Dockerfile)"
          if [ -z "$version" ]; then
            echo >&2 "Could not read SYMFONY_CLI_VERSION from Dockerfile"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Git tag (release) pushes always (re)publish the version tag.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version_is_new=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release tag push — will publish the ${version} image tag."
            exit 0
          fi

          # Branch pushes publish the version tag only if it does not already
          # exist on Docker Hub (immutable). 200 = exists, 404 = new.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            tag_url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags/${version}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$tag_url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "version_is_new=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Tag ${version} already exists — refreshing moving tags only, keeping the immutable ${version} tag."
            else
              echo "version_is_new=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Tag ${version} not found (HTTP ${code}) — will publish it."
            fi
            exit 0
          fi

          # PRs (no push), scheduled rebuilds, and manual runs never (re)write the
          # immutable version tag.
          echo "version_is_new=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ github.event_name }} run — moving tags only, immutable version tag untouched."

  # ---------------------------------------------------------------------------
  # Lint the Dockerfile.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  # ---------------------------------------------------------------------------
  # Build the image, smoke-test it, and scan it with Trivy. This gates the push.
  # The runner is amd64, so the build is native (no QEMU emulation needed).
  # ---------------------------------------------------------------------------
  scan:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build into the local docker daemon so it can be run (smoke test) and
      # scanned before anything is pushed.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm scan-target:latest symfony check:requirements
          docker run --rm scan-target:latest composer --version
          for ext in intl pdo_pgsql pdo_mysql redis sodium gd; do
            docker run --rm scan-target:latest php -m | grep -qx "$ext" \
              || { echo "missing PHP extension: $ext"; exit 1; }
          done

      # Non-blocking SARIF run so findings show up in the Security tab over time.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scan-target:latest
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Blocking gate: fail the build on any HIGH/CRITICAL that isn't suppressed.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scan-target:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Path-scoped, justified, time-boxed suppressions for unfixable CVEs
          # baked into the upstream symfony Go binary (see .trivyignore.yaml).
          trivyignores: .trivyignore.yaml

  # ---------------------------------------------------------------------------
  # Build and push the image. Runs only after the scan gate passed, and never
  # on pull requests. Always refreshes the moving tags (`latest`, `sha`, `main`);
  # the immutable `<version>` tag is added only when `check` says it is new.
  # ---------------------------------------------------------------------------
  push:
    needs: [check, scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # Single source of truth for OCI labels. version/revision/created/url
          # are generated automatically; title/description are curated here.
          labels: |
            org.opencontainers.image.title=symfony-cli
            org.opencontainers.image.description=Symfony CLI on Alpine with the PHP extensions commonly required by Symfony, plus Composer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # Immutable tag matching the Symfony CLI version baked into the image.
            # Only written when `check` decides it is new (or on a release tag), so
            # an already-published version digest is never overwritten by a routine
            # push or a scheduled refresh.
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.version_is_new == 'true' }}
            # Pushes to the default branch (main) and scheduled/manual rebuilds
            # publish `latest`. Since the build is no longer version-gated, `latest`
            # always reflects main and absorbs weekly base-image CVE patches.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
