name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege by default for every job; jobs opt into more where needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref, but let tag (release) builds always
# finish so a published version is never half-built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Docker Hub image name. The repo (e.g. "symfony-cli") lives under your
# Docker Hub account; the account comes from the DOCKERHUB_USERNAME secret.
env:
  IMAGE_NAME: symfony-cli

jobs:
  # ---------------------------------------------------------------------------
  # Lint the Dockerfile.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  # ---------------------------------------------------------------------------
  # Build the image, smoke-test it, and scan it with Trivy. This gates the push.
  # The runner is amd64, so the build is native (no QEMU emulation needed).
  # ---------------------------------------------------------------------------
  scan:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build into the local docker daemon so it can be run (smoke test) and
      # scanned before anything is pushed.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm scan-target:latest symfony check:requirements
          docker run --rm scan-target:latest composer --version
          for ext in intl pdo_pgsql pdo_mysql redis sodium gd; do
            docker run --rm scan-target:latest php -m | grep -qx "$ext" \
              || { echo "missing PHP extension: $ext"; exit 1; }
          done

      # Non-blocking SARIF run so findings show up in the Security tab over time.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scan-target:latest
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Blocking gate: fail the build on any HIGH/CRITICAL that isn't suppressed.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scan-target:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Path-scoped, justified, time-boxed suppressions for unfixable CVEs
          # baked into the upstream symfony Go binary (see .trivyignore.yaml).
          trivyignores: .trivyignore.yaml

  # ---------------------------------------------------------------------------
  # Build and push the image. Runs only after the scan gate passed, and never
  # on pull requests.
  # ---------------------------------------------------------------------------
  push:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # Single source of truth for OCI labels. version/revision/created/url
          # are generated automatically; title/description are curated here.
          labels: |
            org.opencontainers.image.title=symfony-cli
            org.opencontainers.image.description=Symfony CLI on Alpine with the PHP extensions commonly required by Symfony, plus Composer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # Untagged pushes to the default branch (main) publish `latest`.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
